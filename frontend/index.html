<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HEX Discord Activity</title>
    <style>
        body { margin: 0; background: #2f3136; color: white; font-family: Arial, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; overflow: hidden; }
        #status { margin-bottom: 15px; font-size: 20px; font-weight: bold; }
        #players { margin-bottom: 10px; font-size: 16px; color: #b9bbbe; }
        canvas { background: #202225; border-radius: 8px; box-shadow: 0 6px 16px rgba(0,0,0,0.4); cursor: pointer; }
    </style>
</head>
<body>

    <div id="status">Загрузка Discord SDK...</div>
    <div id="players">Ожидание игроков...</div>
    <canvas id="hexCanvas" width="650" height="400"></canvas>

    <script type="module">
        import { DiscordSDK } from "./node_modules/@discord/embedded-app-sdk/dist/index.js";

        // !!! ЗАМЕНИТЕ НА ВАШ URL ПОСЛЕ ДЕПЛОЯ БЭКЕНДА !!!
        const BACKEND_URL = "https://hex-activity.pages.dev/"; 
        
        let discordSdk;
        let roomState = null;
        let userId = "local_user_" + Math.floor(Math.random() * 1000); // фоллбек для тестов в браузере
        let username = "Игрок";
        let roomId = "global_room"; // В Discord можно использовать discordSdk.channelId

        const canvas = document.getElementById("hexCanvas");
        const ctx = canvas.getContext("2d");
        const hexRadius = 18;

        // Инициализация Discord SDK
        async function initDiscord() {
            try {
                // Скрипт setup.sh автоматически подставил сюда ваш APP_ID в прошлый раз,
                // либо вставьте его вручную вместо "ВАШ_APP_ID"
                discordSdk = new DiscordSDK("ВАШ_DISCORD_APP_ID");
                await discordSdk.ready();
                
                // Авторизация в Discord, чтобы получить данные юзера
                const auth = await discordSdk.commands.authorize({
                    client_id: discordSdk.clientId,
                    response_type: "code",
                    state: "",
                    prompt: "none",
                    scope: ["identify", "guilds"],
                });
                
                const user = await discordSdk.commands.getUser();
                if (user) {
                    userId = user.id;
                    username = user.username;
                }
                if (discordSdk.channelId) {
                    roomId = discordSdk.channelId; // Каждому голосовому каналу — своя комната
                }
            } catch (e) {
                console.log("Запущено вне Discord или ошибка SDK. Работает демо-режим.");
            }

            // Подключаемся к комнате на бэкенде
            await joinRoom();
            // Запускаем цикл обновления (раз в 2 секунды)
            setInterval(getRoomState, 2000);
            // Первая отрисовка
            drawBoard();
        }

        async function joinRoom() {
            const res = await fetch(`${BACKEND_URL}/api/join`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ roomId, userId, username })
            });
            roomState = await res.json();
            updateUI();
        }

        async function getRoomState() {
            const res = await fetch(`${BACKEND_URL}/api/state?roomId=${roomId}`);
            roomState = await res.json();
            updateUI();
            drawBoard();
        }

        function updateUI() {
            if (!roomState) return;
            const p1 = roomState.player1 ? roomState.player1.name : "Ожидание...";
            const p2 = roomState.player2 ? roomState.player2.name : "Ожидание...";
            document.getElementById("players").innerText = `🔴 Красный (Верх-Низ): ${p1} vs 🔵 Синий (Лево-Право): ${p2}`;
            
            if (roomState.winner) {
                document.getElementById("status").innerText = `Победил ${roomState.winner}!`;
            } else {
                document.getElementById("status").innerText = `Ход игрока: ${roomState.turn === 'red' ? 'Красный 🔴' : 'Синий 🔵'}`;
            }
        }

        // Математика HEX-сетки (координаты полигонов)
        function getHexCenter(row, col) {
            const xOffset = col * hexRadius * Math.sqrt(3) + (row * hexRadius * Math.sqrt(3)) / 2 + 50;
            const yOffset = row * hexRadius * 1.5 + 50;
            return { x: xOffset, y: yOffset };
        }

        function drawHex(x, y, color) {
            ctx.beginPath();
            for (let i = 0; i < 6; i++) {
                const angle = (Math.PI / 3) * i + Math.PI / 6;
                ctx.lineTo(x + hexRadius * Math.cos(angle), y + hexRadius * Math.sin(angle));
            }
            ctx.closePath();
            ctx.fillStyle = color;
            ctx.fill();
            ctx.strokeStyle = "#2f3136";
            ctx.lineWidth = 2;
            ctx.stroke();
        }

        function drawBoard() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            if (!roomState) return;

            // Рисуем сетку 11x11
            for (let row = 0; row < 11; row++) {
                for (let col = 0; col < 11; col++) {
                    const { x, y } = getHexCenter(row, col);
                    const cellValue = roomState.board[row * 11 + col];
                    
                    let color = "#4f545c"; // пустая
                    if (cellValue === 1) color = "#ed4245"; // Красный
                    if (cellValue === 2) color = "#5865f2"; // Синий
                    
                    drawHex(x, y, color);
                }
            }
        }

        // Клик по полю
        canvas.addEventListener("click", async (e) => {
            if (!roomState || roomState.winner) return;

            const rect = canvas.getBoundingClientRect();
            const clickX = e.clientX - rect.left;
            const clickY = e.clientY - rect.top;

            // Ищем, в какой гексагон кликнули
            for (let row = 0; row < 11; row++) {
                for (let col = 0; col < 11; col++) {
                    const { x, y } = getHexCenter(row, col);
                    const dist = Math.hypot(clickX - x, clickY - y);
                    
                    // Упрощенная проверка попадания по радиусу
                    if (dist < hexRadius * 0.9) {
                        const cellIndex = row * 11 + col;
                        
                        // Отправляем ход на сервер
                        const res = await fetch(`${BACKEND_URL}/api/move`, {
                            method: "POST",
                            headers: { "Content-Type": "application/json" },
                            body: JSON.stringify({ roomId, userId, cellIndex })
                        });

                        if (res.ok) {
                            roomState = await res.json();
                            updateUI();
                            drawBoard();
                        }
                        break;
                    }
                }
            }
        });

        initDiscord();
    </script>
</body>
</html>
